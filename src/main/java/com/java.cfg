[Application]
app.name=JavaDesktopApp
app.version=1.0.0
app.runtime=$APPDIR\runtime
app.identifier=com.example.JavaDesktopApp
app.classpath=$APPDIR\app\JavaDesktopApp.jar;$APPDIR\app\libs\mysql-connector-j-9.1.0.jar;$APPDIR\app\libs\gson-2.11.0.jar;$APPDIR\app\libs\HikariCP-6.2.1.jar;$APPDIR\app\libs\slf4j-simple-2.0.16.jar
app.mainclass=com.example.JavaDesktopApp.Main
app.splash=$APPDIR\app\splash.png

[JavaOptions]
java-options=-Xms256m
java-options=-Xmx1024m
java-options=-Dfile.encoding=UTF-8
java-options=-Duser.language=pl
java-options=-Dapp.config.path=$APPDIR\config.ini
java-options=-Djavax.net.ssl.trustStore=$APPDIR\certs\my_certificate.pfx

[ArgOptions]
arguments=--mode=production
arguments=--db-init=true
