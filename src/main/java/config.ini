; Konfiguracja aplikacji Java Desktop (.exe)
[Application]
AppName=JavaDesktopApp
Version=1.0.0
Environment=production
Language=pl
DebugMode=false
LibsDirectory=./libs

[JVM]
; Parametry maszyny wirtualnej Javy (np. dla Launch4j / WinRun4J)
MinMemory=256M
MaxMemory=1024M
MainClass=com.example.JavaDesktopApp.Main
JavaMinVersion=17

[Database]
; Ustawienia połączenia dla java.sql / HikariCP
Driver=com.mysql.cj.jdbc.Driver
Host=localhost
Port=3306
DatabaseName=java_app_db
Username=root
Password=tajne_haslo_123
MaxPoolSize=10
ConnectionTimeout=30000

[Security]
; Ustawienia certyfikatu i szyfrowania
CertificatePath=./certs/my_certificate.pfx
ManifestPath=./manifest.xml
VerifySignature=true
